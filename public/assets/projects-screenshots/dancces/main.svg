<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#1a252f" />
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1abc9c" />
      <stop offset="100%" stop-color="#27ae60" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c0392b" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgGradient)" rx="40" />

  <polygon points="250,80 380,150 380,310 250,380 120,310 120,150" 
           fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8" />
  <polygon points="250,110 350,165 350,285 250,340 150,285 150,165" 
           fill="none" stroke="rgba(26, 188, 156, 0.3)" stroke-width="4" />

  <circle cx="250" cy="225" r="90" fill="none" stroke="rgba(26, 188, 156, 0.15)" stroke-width="2" stroke-dasharray="8,8" />
  <circle cx="250" cy="225" r="130" fill="none" stroke="rgba(26, 188, 156, 0.1)" stroke-width="2" stroke-dasharray="15,10" />

  <line x1="250" y1="225" x2="250" y2="110" stroke="#1abc9c" stroke-width="4" opacity="0.6" />
  <line x1="250" y1="225" x2="350" y2="285" stroke="#1abc9c" stroke-width="4" opacity="0.6" />
  <line x1="250" y1="225" x2="150" y2="285" stroke="#1abc9c" stroke-width="4" opacity="0.6" />

  <circle cx="250" cy="110" r="16" fill="url(#nodeGradient)" filter="url(#glow)" />
  <circle cx="350" cy="285" r="16" fill="url(#nodeGradient)" filter="url(#glow)" />
  <circle cx="150" cy="285" r="16" fill="url(#nodeGradient)" filter="url(#glow)" />
  
  <line x1="250" y1="225" x2="360" y2="150" stroke="#e74c3c" stroke-width="3" opacity="0.4" stroke-dasharray="5,5" />
  <circle cx="360" cy="150" r="12" fill="url(#accentGradient)" />
  <path d="M355,145 L365,155 M365,145 L355,155" stroke="#fff" stroke-width="2" />

  <circle cx="250" cy="225" r="35" fill="#2c3e50" stroke="#1abc9c" stroke-width="6" filter="url(#glow)" />
  <circle cx="250" cy="225" r="15" fill="#1abc9c" />

  <text x="250" y="430" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    DANACCESS
  </text>
  <text x="250" y="455" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#7f8c8d" text-anchor="middle" letter-spacing="2">
    AUTONOMOUS NETWORK CONTROL
  </text>
</svg>
